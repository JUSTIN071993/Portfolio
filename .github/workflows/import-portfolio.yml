name: Import portfolio source

on:
  push:
    paths:
      - portfolio-source-67dc28a.zip

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand committed portfolio
        shell: bash
        run: |
          if [ ! -f portfolio-source-67dc28a.zip ]; then exit 0; fi
          unzip -o portfolio-source-67dc28a.zip -d .
          rm portfolio-source-67dc28a.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Justin Bernaldez portfolio"
          git push
